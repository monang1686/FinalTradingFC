name: FUT Trader 27 - Market Trends
on:
  push:
    branches: [fut-trader-27-test]
    paths: ['*.py', 'tests/**', 'config/**', 'experimental/**', 'prices.json', '.github/workflows/market-trends-test.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fut27-experimental-history-test
  cancel-in-progress: false
jobs:
  market-trends:
    if: github.ref == 'refs/heads/fut-trader-27-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fut-trader-27-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Val Town public FC27 feed diagnostic (read-only, non-blocking)
        continue-on-error: true
        run: python experimental/mobile-trader/valtown_source_probe.py
      - name: Restore experimental snapshot history
        uses: actions/cache/restore@v4
        with:
          path: work/valtown-history.json
          key: fut27-history-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fut27-history-test-
      - name: Collect isolated experimental snapshot (no production publishing)
        continue-on-error: true
        run: python experimental/mobile-trader/valtown_snapshot.py work/valtown-experimental.json
      - name: Append experimental snapshot and compare with prior observation
        continue-on-error: true
        run: python experimental/mobile-trader/valtown_history.py work/valtown-history.json work/valtown-experimental.json work/valtown-comparison.json
      - name: Cache experimental history (test branch only)
        if: hashFiles('work/valtown-history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: work/valtown-history.json
          key: fut27-history-test-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish experimental history to test branch (if snapshot exists)
        if: hashFiles('work/valtown-experimental.json') != ''
        run: |
          mkdir -p experimental/mobile-trader/data
          python experimental/mobile-trader/valtown_history.py experimental/mobile-trader/data/history.json work/valtown-experimental.json work/published-comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('experimental/mobile-trader/data/history.json').read_text())
          assert d['schema']=='fut27-experimental-history-v1'
          assert 1<=len(d['snapshots'])<=336
          assert all(s['verified'] is False and s['production_signals_enabled'] is False for s in d['snapshots'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/mobile-trader/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data(test): publish unverified FC27 history [skip ci]"
            git push origin HEAD:fut-trader-27-test
          fi
      - name: Offline source permission audit (no external requests)
        run: python audit_market_sources.py
      - run: mkdir -p work
      - run: python experimental_scanner.py --demo > work/scanner-synthetic.json
      - run: python market-trends.py prices.json > results.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-trends-results
          path: |
            results.json
            work/scanner-synthetic.json
            work/valtown-experimental.json
            work/valtown-history.json
            work/valtown-comparison.json
            experimental/mobile-trader/dashboard.html
# No schedule/write permission until a production source is verified.
# GitHub scheduled workflows run only from the default branch: do not move this
# to main. Future isolated collection requires an approved external dispatcher
# targeting fut-trader-27-test every 30 minutes, or a separate test repository.
