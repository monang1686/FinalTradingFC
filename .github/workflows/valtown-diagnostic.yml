name: FUT Trader 27 - Val Town Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fut-trader-27-test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fut-trader-27-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect feed metadata only (no price persistence)
        run: python diagnose_valtown.py
