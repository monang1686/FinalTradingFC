<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Market Trends 2.0 — test</title>
<style>body{font:16px system-ui;background:#0b1220;color:#eef3fb;max-width:1100px;margin:auto;padding:24px}article{background:#19243a;padding:16px;margin:12px 0;border-radius:12px}td,th{padding:10px;text-align:left;border-bottom:1px solid #52617b}table{width:100%}button{padding:12px}small{color:#b5c2d6}.scroll{overflow:auto}</style>
<h1>Market Trends 2.0 — sperimentale</h1><p>FC 27 · PS5 / mercato console condiviso. Nessuna asta o esecuzione garantita.</p>
<button id="refresh">Controlla stato</button><p id="status" role="status"></p><main id="sources"></main>
<script>
const statusEl=document.getElementById('status'),root=document.getElementById('sources');
const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
async function refresh(){root.replaceChildren();try{const response=await fetch('./market-state.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Stato non disponibile');const data=await response.json();statusEl.textContent='Stato: '+data.status+' · Automazione periodica: '+(data.automations_active?'attiva':'non attiva');for(const [id,s] of Object.entries(data.sources)){const a=node('article','');a.append(node('h2',id),node('p','Fonte: '+s.endpoint),node('p','Esito raccolta: '+s.status),node('p',s.block_reason||''),node('small','Ultimo successo: '+(s.last_success_at||'mai')+' · Attendibilità: osservazioni validate solo quando la fonte è autorizzata; nessuna garanzia di esecuzione.'));const rows=['ok','waiting_interval'].includes(s.status)?(s.analysis?.trends||[]).filter(r=>{const age=(Date.now()-Date.parse(r.timestamp))/1000;return age>=0&&age<=3600}):[];a.append(node('p','Carte recenti mostrate: '+rows.length));const table=node('table',''),head=node('tr','');['Carta / EA item ID','Prezzo','Età','1h / 6h / 24h','Liquidità','Rischi'].forEach(v=>head.append(node('th',v)));table.append(head);for(const r of rows){const tr=node('tr','');[r.name+' / '+r.id,r.price,Math.floor((Date.now()-Date.parse(r.timestamp))/60000)+' min',['1h','6h','24h'].map(k=>r.changes_percent[k]==null?'n.d.':r.changes_percent[k]+'%').join(' / '),r.sales_1h==null?'sconosciuta':r.sales_1h+' vendite/h',(r.risk_flags||[]).join(', ')].forEach(v=>tr.append(node('td',v)));table.append(tr)}const scroll=node('div','');scroll.className='scroll';scroll.append(table);a.append(scroll);for(const r of s.analysis?.results||[]){if(rows.some(x=>x.id===r.id))a.append(node('p',r.name+': margine netto stimato '+r.net_profit_estimate+' crediti ('+r.net_roi_percent+'%) · target storico '+r.sell_target_estimate+' · '+r.warning))}root.append(a)}}catch(e){statusEl.textContent=e.message}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,60000);
</script></html>
