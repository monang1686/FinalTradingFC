<!doctype html><html lang="it"><head><meta charset="utf-8"><style>body{font:14px system-ui;background:#111e30;color:#fff;width:320px;padding:12px}label{display:block;margin:9px 0}input,select,button{width:100%;padding:9px;box-sizing:border-box;background:#20354d;color:white;border:1px solid #55718c;border-radius:6px}button{background:#176d56;cursor:pointer}small{color:#aabed0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>FUT Trader 27</h2><p>Apri una carta nella Web App e premi Leggi prezzi visibili. Se compaiono più inserzioni, scegli quella corretta.</p><button id="read">Leggi selezione</button><button id="scan" type="button">Leggi prezzi visibili</button><pre id="selected"></pre><label>Inserzioni rilevate<select id="listings"><option value="">Esegui prima la scansione</option></select></label><button id="useListing" type="button">Usa inserzione selezionata</button><button id="captureAll" type="button">Acquisisci carta e prezzo</button><button id="inspectCard" type="button">Analizza carta visibile</button><small id="captureTime"></small><pre id="cardContext"></pre><label>ID EA versione<input id="id" inputmode="numeric" placeholder="ID carta esatto"></label><label>Nome<input id="name"></label><label>Strategia<select id="strategy"><option value="fluctuation">Fluctuation</option><option value="fodder">Fodder</option><option value="sniping">Sniping</option></select></label><label>Prezzo osservato<input id="buy" type="number" min="1"></label><label>Riferimento storico verificato<input id="target" type="number" min="1"></label><button id="export">Esporta osservazione JSON</button><p id="status" role="status"></p><small>Solo lettura su richiesta del testo visibile; nessun cookie, richiesta di rete o automazione EA.</small><script src="popup.js"></script></body></html>
